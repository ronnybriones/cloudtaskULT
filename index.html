<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.0</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', Arial, Helvetica, sans-serif; }

    body {
      background:
        radial-gradient(circle at 15% 15%, rgba(99,102,241,.20), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(168,85,247,.16), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(14,165,233,.14), transparent 52%),
        linear-gradient(160deg, #0f172a 0%, #1e1b4b 55%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: #e2e8f0;
    }

    .app {
      width: 100%;
      max-width: 760px;
      background: rgba(15,23,42,.84);
      border: 1px solid rgba(129,140,248,.30);
      border-radius: 24px;
      box-shadow: 0 25px 55px rgba(2,6,23,.65);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 52%, #a855f7 100%);
      color: white;
      padding: 32px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 82% 0%, rgba(255,255,255,.20), transparent 52%);
    }
    .header-icon, .header h1, .header p, .version { position: relative; z-index: 1; }
    .header-icon {
      width: 76px; height: 76px;
      display: grid; place-items: center;
      margin: 0 auto 12px;
      background: rgba(255,255,255,.16);
      border: 2px solid rgba(255,255,255,.45);
      border-radius: 50%;
      font-size: 40px;
      box-shadow: 0 0 22px rgba(255,255,255,.28);
    }
    .header h1 { font-size: 38px; font-weight: 800; letter-spacing: .5px; text-shadow: 0 2px 14px rgba(2,6,23,.4); }
    .header p { opacity: .94; font-size: 15px; margin-top: 4px; }

    .version {
      display: inline-block;
      margin-top: 14px;
      padding: 7px 16px;
      border-radius: 22px;
      background: rgba(15,23,42,.42);
      border: 1px solid rgba(255,255,255,.4);
      color: #fbbf24;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .content { padding: 30px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 26px; }

    input[type="text"] {
      flex: 1;
      padding: 15px 18px;
      background: rgba(30,41,59,.85);
      border: 1.5px solid #334155;
      border-radius: 14px;
      color: #f1f5f9;
      font-size: 16px;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]::placeholder { color: #64748b; }
    input[type="text"]:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129,140,248,.25); }

    button { cursor: pointer; }

    #addTaskBtn {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 15px 26px;
      font-weight: 700;
      transition: transform .15s, box-shadow .2s;
      box-shadow: 0 6px 18px rgba(99,102,241,.38);
    }
    #addTaskBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(99,102,241,.5); }
    #addTaskBtn:active { transform: translateY(1px); }

    .filters { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }

    .filter-btn {
      border: none;
      background: rgba(51,65,85,.5);
      color: #cbd5e1;
      padding: 10px 18px;
      border-radius: 24px;
      font-weight: 600;
      transition: background .2s, color .2s, transform .15s;
    }
    .filter-btn:hover { background: rgba(99,102,241,.28); color: #e0e7ff; transform: translateY(-1px); }
    .filter-btn.active { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; box-shadow: 0 4px 14px rgba(99,102,241,.45); }

    .task-list { list-style: none; }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(30,41,59,.72);
      border: 1px solid rgba(100,116,139,.35);
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 12px;
      transition: transform .15s, border-color .2s, box-shadow .2s;
    }
    .task:hover { border-color: rgba(129,140,248,.65); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(2,6,23,.5); }
    .task-left { display: flex; align-items: center; gap: 14px; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: #8b5cf6; cursor: pointer; }
    .task.completed { background: rgba(15,23,42,.5); border-left: 4px solid #22c55e; }
    .task.completed .task-text { text-decoration: line-through; color: #64748b; }

    .delete-btn {
      border: none;
      background: rgba(239,68,68,.16);
      color: #f87171;
      padding: 9px 13px;
      border-radius: 10px;
      transition: background .2s, transform .15s;
    }
    .delete-btn::before { content: "🗑 "; }
    .delete-btn:hover { background: rgba(239,68,68,.34); transform: scale(1.06); }

    .summary {
      margin-top: 24px;
      padding: 15px 20px;
      border-radius: 14px;
      border: 1px solid rgba(129,140,248,.45);
      background: linear-gradient(135deg, rgba(30,58,138,.35), rgba(99,102,241,.35));
      color: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .summary-label { font-size: 15px; font-weight: 600; }
    #pendingCount {
      display: inline-grid;
      place-items: center;
      min-width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-weight: 800; font-size: 18px;
      box-shadow: 0 4px 12px rgba(99,102,241,.55);
    }

    .empty { text-align: center; color: #94a3b8; padding: 32px; font-size: 15px; }
    .empty::before { content: "☁ "; }

    footer {
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.12);
      padding: 20px;
      font-size: 13px;
      color: #a3b0c6;
    }
    .dev-title { color: #e2e8f0; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .dev-names { line-height: 1.75; color: #b8c3d8; font-size: 13.5px; }
    .footer-meta { margin-top: 10px; color: #8494ad; font-size: 12.5px; }

    @media (max-width: 600px) {
      .input-group { flex-direction: column; }
      .header h1 { font-size: 28px; }
      .header-icon { width: 60px; height: 60px; font-size: 30px; }
      #addTaskBtn { width: 100%; }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="header-icon">☁</div>
    <h1>CloudTask</h1>
    <p>🚀 Gestor de tareas interactivo</p>
    <span class="version">Versión 1.0</span>
  </div>

  <div class="content">

    <div class="input-group">
      <input id="taskInput" type="text" placeholder="Escribe una nueva tarea...">
      <button id="addTaskBtn">➕ Agregar</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">🗂️ Todas</button>
      <button class="filter-btn" data-filter="pending">⏳ Pendientes</button>
      <button class="filter-btn" data-filter="completed">✅ Completadas</button>
    </div>

    <ul id="taskList" class="task-list"></ul>

    <div class="summary">
      <span class="summary-label">📌 Tareas pendientes:</span>
      <strong id="pendingCount">0</strong>
    </div>

  </div>

  <footer>
    <div class="credits">
      <p class="dev-title">✨ Desarrollado por:</p>
      <p class="dev-names">Ronny Yonaiquer Briones Sornoza</p>
      <p class="dev-names">Julio Tommy Alava Rodrigez</p>
      <p class="dev-names">Franklin Jonathan Cedeño Farfan</p>
    </div>
    <div class="footer-meta">CloudTask · Versión 1.0 · Práctica de Computación en la Nube</div>
  </footer>

</div>

<script>
  const taskInput = document.getElementById("taskInput");
  const addTaskBtn = document.getElementById("addTaskBtn");
  const taskList = document.getElementById("taskList");
  const pendingCount = document.getElementById("pendingCount");
  const filterButtons = document.querySelectorAll(".filter-btn");

  let currentFilter = "all";

  let tasks = [
    { id: 1, text: "Subir proyecto a GitHub", completed: false },
    { id: 2, text: "Desplegar aplicación en Vercel", completed: false },
    { id: 3, text: "Probar aplicación desde el teléfono", completed: true }
  ];

  function renderTasks() {
    taskList.innerHTML = "";

    const filteredTasks = tasks.filter(task => {
      if (currentFilter === "pending") return !task.completed;
      if (currentFilter === "completed") return task.completed;
      return true;
    });

    if (filteredTasks.length === 0) {
      taskList.innerHTML =
        '<li class="empty">No hay tareas para mostrar</li>';
    }

    filteredTasks.forEach(task => {
      const li = document.createElement("li");

      li.className = "task";

      if (task.completed) {
        li.classList.add("completed");
      }

      li.innerHTML = `
        <div class="task-left">
          <input
            type="checkbox"
            ${task.completed ? "checked" : ""}
            onchange="toggleTask(${task.id})"
          >

          <span class="task-text">
            ${task.text}
          </span>
        </div>

        <button
          class="delete-btn"
          onclick="deleteTask(${task.id})"
        >
          Eliminar
        </button>
      `;

      taskList.appendChild(li);
    });

    updatePendingCount();
  }

  function addTask() {
    const text = taskInput.value.trim();

    if (text === "") {
      alert("Escribe una tarea.");
      return;
    }

    tasks.push({
      id: Date.now(),
      text,
      completed: false
    });

    taskInput.value = "";

    renderTasks();
  }

  function toggleTask(id) {
    tasks = tasks.map(task =>
      task.id === id
        ? { ...task, completed: !task.completed }
        : task
    );

    renderTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(task => task.id !== id);
    renderTasks();
  }

  function updatePendingCount() {
    pendingCount.textContent =
      tasks.filter(task => !task.completed).length;
  }

  addTaskBtn.addEventListener("click", addTask);

  taskInput.addEventListener("keypress", event => {
    if (event.key === "Enter") addTask();
  });

  filterButtons.forEach(button => {
    button.addEventListener("click", function() {
      filterButtons.forEach(btn =>
        btn.classList.remove("active")
      );

      this.classList.add("active");
      currentFilter = this.dataset.filter;

      renderTasks();
    });
  });

  renderTasks();
</script>

</body>
</html>
